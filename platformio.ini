; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI
    paulstoffregen/XPT2046_Touchscreen

build_flags =
    ; LVGL (library present in project, keep this flag)
    -D LV_CONF_INCLUDE_SIMPLE

    ; ── TFT_eSPI: bypass User_Setup.h entirely ──────────────────────────────
    ; USER_SETUP_LOADED tells TFT_eSPI to ignore its own User_Setup.h
    ; and use only what is defined here instead.
    -D USER_SETUP_LOADED

    ; Driver — ST7796S is the chip on this Hosyond 4.0" board
    -D ST7796_DRIVER
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480

    ; SPI pins — this board uses the ESP32 HSPI peripheral (GPIO 13/12/14)
    ; NOT the VSPI peripheral (23/19/18) that generic setups default to.
    -D TFT_MOSI=13
    -D TFT_MISO=12
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1       ; Reset is tied to the board RESET line, not a spare GPIO

    ; Backlight — without this the panel stays black even when rendering correctly
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH

    ; Touch controller (XPT2046) — keep defined so the library compiles cleanly
    -D TOUCH_CS=33

    ; Fonts — must list every font used in main.cpp or drawString will be blank
    -D LOAD_GLCD=1       ; Font 1  (8 px,  always include as fallback)
    -D LOAD_FONT2=1      ; Font 2  (16 px, used for stats and labels)
    -D LOAD_FONT4=1      ; Font 4  (26 px, used for titles)
    -D LOAD_FONT6=1      ; Font 6  (48 px digits)
    -D LOAD_FONT7=1      ; Font 7  (7-seg digits)
    -D LOAD_FONT8=1      ; Font 8  (75 px digits)
    -D LOAD_GFXFF=1      ; Adafruit GFX free-font support (FreeSans etc.)
    -D SMOOTH_FONT=1

    ; SPI clock — 40 MHz is safe for ST7796S over short PCB traces
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    
